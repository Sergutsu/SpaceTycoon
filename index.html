<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#040912">
  <meta name="description" content="SpaceTycoon — орбитальная верфь: стройте корабли, выполняйте контракты, развивайте станцию и исследуйте космос.">
  <title>SpaceTycoon — Орбитальная верфь</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="orbitalBackground" aria-hidden="true"></div>
  <div class="space-vignette" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>
  <div id="sprite" aria-hidden="true"></div>
  <div class="nav-scrim" id="navScrim"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Главная навигация">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 36 40" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M18 2 32 10v20L18 38 4 30V10L18 2Z"/><path d="M18 9 26 27H10L18 9Z"/><circle cx="18" cy="22" r="3"/><path d="M18 2v7M4 30l6-3M32 30l-6-3"/></svg>
        <div><div class="brand-name">SPACETYCOON</div><div class="brand-sub">ОРБИТАЛЬНАЯ ВЕРФЬ</div></div>
      </div>
      <div class="nav-label">УПРАВЛЕНИЕ СТАНЦИЕЙ</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-bottom">
        <div class="station-status"><span class="status-dot"></span>Станция «Аврора» · онлайн</div>
        <button class="btn btn-sm btn-block" data-action="settings"><svg class="icon"><use href="#i-settings"/></svg>Настройки</button>
        <button class="btn btn-sm btn-block btn-ghost" data-action="help"><svg class="icon"><use href="#i-help"/></svg>Руководство</button>
        <div class="save-info" id="saveNote">Автосохранение включено</div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="menuButton" aria-label="Открыть меню" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button>
        <div class="resources" id="resources" aria-label="Ресурсы"></div>
        <div class="top-controls">
          <div class="clock-box"><div class="clock" id="clock">00:00</div><div class="clock-day" id="clockDay">ДЕНЬ 1 · 1×</div></div>
          <div class="speed-group" role="group" aria-label="Скорость симуляции">
            <button class="speed-btn" data-speed="0" aria-label="Пауза" title="Пауза (пробел)">Ⅱ</button>
            <button class="speed-btn active" data-speed="1" aria-label="Скорость 1×">1×</button>
            <button class="speed-btn" data-speed="2" aria-label="Скорость 2×">2×</button>
            <button class="speed-btn" data-speed="4" aria-label="Скорость 4×">4×</button>
          </div>
          <button class="icon-btn save-top" data-action="save" aria-label="Сохранить" title="Сохранить"><svg class="icon"><use href="#i-save"/></svg></button>
          <button class="icon-btn" data-action="help" aria-label="Руководство" title="Руководство (H)"><svg class="icon"><use href="#i-help"/></svg></button>
          <button class="icon-btn" data-action="settings" aria-label="Настройки" title="Настройки"><svg class="icon"><use href="#i-settings"/></svg></button>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#040912;color:#e9f0f6;font:16px sans-serif;padding:30px;text-align:center">Для запуска SpaceTycoon включите JavaScript в браузере.</div></noscript>
  <script src="assets/three.r128.min.js"></script>
  <script src="assets/earth-textures.js"></script>
  <script src="assets/orbit-background.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/engine.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/views.js"></script>
  <script src="assets/morphdom.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
